<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sparks Läsläxa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@800&display=swap">
<style>
:root{--paper:#F2F5FB;--card:#FFFFFF;--ink:#1A2142;--muted:#58628A;--line:#D9E0EE;--sea:#2F55E4;--sea-ink:#FFFFFF;--spark:#FFC531;--wrong:#C63D29;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0F1430;--card:#19203F;--ink:#EDF0FB;--muted:#A2ABCE;--line:#2C3563;--sea:#8099FF;--sea-ink:#0F1430;--spark:#FFCF4D;--wrong:#FF8B78;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;padding-inline:16px;box-sizing:border-box}
main{width:100%;max-width:24rem;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:28px 24px;box-sizing:border-box}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Grandstander','Trebuchet MS',system-ui,sans-serif;font-weight:800;font-size:2rem;margin:4px 0 8px;line-height:1.1}
p{margin:0 0 16px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
input[type=password]{font:inherit;font-size:1.1rem;padding:.6em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--sea)}
label{display:flex;gap:8px;align-items:center;font-size:.95rem}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:.7em 1em;background:var(--sea);color:var(--sea-ink);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
#err{color:var(--wrong);font-weight:700;margin:0;min-height:1.4em}
</style>
</head>
<body>
<main>

  <h1>Sparks Läsläxa</h1>

    <button id="go" type="submit">Öppna</button>
    <p id="err" role="alert"></p>
  </form>
</main>
